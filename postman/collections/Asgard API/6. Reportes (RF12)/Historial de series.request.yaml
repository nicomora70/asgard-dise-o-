$kind: http-request
description: Series no deshechas del socio. Acepta `ejercicioId`, `desde` y `hasta` (ISO-8601).
url: "{{baseUrl}}/api/socios/{{socioId}}/historial"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      pm.test('Las series deshechas no aparecen', () => pm.expect(pm.response.json().length === 3).to.be.true);
    language: text/javascript
order: 1000
