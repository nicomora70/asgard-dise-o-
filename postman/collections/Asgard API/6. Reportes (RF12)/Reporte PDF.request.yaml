$kind: http-request
description: Descarga el reporte de progreso en `application/pdf`.
url: "{{baseUrl}}/api/socios/{{socioId}}/reporte/pdf"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      pm.test('Es un PDF', () => pm.expect(pm.response.headers.get('Content-Type').includes('application/pdf')).to.be.true);
    language: text/javascript
order: 3000
