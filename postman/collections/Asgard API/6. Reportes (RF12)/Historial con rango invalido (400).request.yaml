$kind: http-request
description: "`desde` es posterior a `hasta`. Responde 400."
url: "{{baseUrl}}/api/socios/{{socioId}}/historial?desde=2026-12-31T00:00:00Z&hasta=2026-01-01T00:00:00Z"
method: GET
queryParams:
  desde: 2026-12-31T00:00:00Z
  hasta: 2026-01-01T00:00:00Z
scripts:
  - type: afterResponse
    code: |-
      pm.test('Valida el rango', () => pm.response.to.have.status(400));
      pm.test('El error trae un mensaje en espanol', () => pm.expect(pm.response.json().mensaje).to.be.a('string').and.not.empty);
      pm.test('Mensaje: desde', () => pm.expect(pm.response.json().mensaje).to.include('desde'));
    language: text/javascript
order: 2000
