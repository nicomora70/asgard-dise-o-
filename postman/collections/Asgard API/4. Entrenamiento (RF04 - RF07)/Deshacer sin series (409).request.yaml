$kind: http-request
description: El socio 2 no registro series, asi que la pila de deshacer esta vacia. Responde 409.
url: "{{baseUrl}}/api/socios/{{socio2Id}}/series/deshacer"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Pila vacia', () => pm.response.to.have.status(409));
      pm.test('El error trae un mensaje en espanol', () => pm.expect(pm.response.json().mensaje).to.be.a('string').and.not.empty);
      pm.test('Mensaje: No hay series para deshacer', () => pm.expect(pm.response.json().mensaje).to.include('No hay series para deshacer'));
    language: text/javascript
order: 20000
