$kind: http-request
description: Un id de sesion que no existe, o que es de otro socio, responde 404.
url: "{{baseUrl}}/api/socios/{{socioId}}/sesiones/no-existe/completar"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 404', () => pm.response.to.have.status(404));
      pm.test('El error trae un mensaje en espanol', () => pm.expect(pm.response.json().mensaje).to.be.a('string').and.not.empty);
      pm.test('Mensaje: No existe la sesion', () => pm.expect(pm.response.json().mensaje).to.include('No existe la sesion'));
    language: text/javascript
order: 15000
