$kind: http-request
description: Cierra la sesion de hoy como COMPLETADA.
url: "{{baseUrl}}/api/socios/{{socioId}}/sesiones/{{sesionId}}/completar"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      pm.test('Queda completada', () => pm.expect(pm.response.json().estado === 'COMPLETADA').to.be.true);
    language: text/javascript
order: 12000
