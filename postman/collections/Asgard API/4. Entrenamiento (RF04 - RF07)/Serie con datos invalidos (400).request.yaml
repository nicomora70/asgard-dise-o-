$kind: http-request
description: Peso negativo y 0 repeticiones responden 400.
url: "{{baseUrl}}/api/socios/{{socioId}}/series"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ejercicioId": "{{sentadillaId}}",
      "peso": -5,
      "repeticiones": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Valida el cuerpo', () => pm.response.to.have.status(400));
      pm.test('El error trae un mensaje en espanol', () => pm.expect(pm.response.json().mensaje).to.be.a('string').and.not.empty);
    language: text/javascript
order: 9000
