$kind: http-request
description: Sesiones del socio, de la mas reciente a la mas antigua.
url: "{{baseUrl}}/api/socios/{{socioId}}/sesiones"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      pm.test('La sesion quedo completada', () => pm.expect(pm.response.json().find(s => s.id === pm.collectionVariables.get('sesionId')).estado).to.eql('COMPLETADA'));
    language: text/javascript
order: 16000
