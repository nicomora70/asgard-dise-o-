$kind: http-request
description: Previsualiza una serie de 80 kg. Avisa de la sobrecarga pero `permitido` siempre es true.
url: "{{baseUrl}}/api/socios/{{socioId}}/series/validar?ejercicioId={{sentadillaId}}&peso=80&repeticiones=5"
method: GET
queryParams:
  ejercicioId: "{{sentadillaId}}"
  peso: "80"
  repeticiones: "5"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      pm.test('Advierte pero permite', () => pm.expect(pm.response.json().conAdvertencia && pm.response.json().permitido).to.be.true);
    language: text/javascript
order: 5000
