$kind: http-request
description: El socio 2 todavia no tiene rutina, por eso responde 409.
url: "{{baseUrl}}/api/socios/{{socio2Id}}/rutinas/activa"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Sin rutina activa', () => pm.response.to.have.status(409));
      pm.test('El error trae un mensaje en espanol', () => pm.expect(pm.response.json().mensaje).to.be.a('string').and.not.empty);
    language: text/javascript
order: 6000
