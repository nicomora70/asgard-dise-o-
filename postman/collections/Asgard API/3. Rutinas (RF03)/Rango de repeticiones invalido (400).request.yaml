$kind: http-request
description: "`repsMin` mayor que `repsMax` responde 400."
url: "{{baseUrl}}/api/socios/{{socioId}}/rutinas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Mala",
      "semanas": 4,
      "dias": [
        {
          "dia": "MONDAY",
          "ejercicios": [
            {
              "ejercicioId": "{{sentadillaId}}",
              "series": 3,
              "repsMin": 12,
              "repsMax": 8,
              "rpeObjetivo": 8,
              "cargaInicial": 60,
              "descansoSegundos": 120
            }
          ]
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Valida el rango', () => pm.response.to.have.status(400));
      pm.test('El error trae un mensaje en espanol', () => pm.expect(pm.response.json().mensaje).to.be.a('string').and.not.empty);
    language: text/javascript
order: 2000
