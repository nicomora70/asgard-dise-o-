$kind: http-request
description: Lista todos los socios registrados.
url: "{{baseUrl}}/api/socios"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      pm.test('Incluye a los dos socios', () => { const ids = pm.response.json().map(s => s.id); pm.expect(ids).to.include(pm.collectionVariables.get('socioId')); pm.expect(ids).to.include(pm.collectionVariables.get('socio2Id')); });
    language: text/javascript
order: 13000
