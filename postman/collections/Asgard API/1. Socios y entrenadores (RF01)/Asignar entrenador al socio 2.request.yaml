$kind: http-request
description: Asigna el socio 2 al entrenador con cupo 1. Con esto el entrenador queda lleno.
url: "{{baseUrl}}/api/socios/{{socio2Id}}/entrenador/{{entrenadorLlenoId}}"
method: PUT
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      pm.test('Queda asignado', () => pm.expect(pm.response.json().entrenadorId).to.eql(pm.collectionVariables.get('entrenadorLlenoId')));
    language: text/javascript
order: 14000
