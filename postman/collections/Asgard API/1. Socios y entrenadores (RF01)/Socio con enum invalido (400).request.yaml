$kind: http-request
description: "`nivel` solo acepta PRINCIPIANTE, INTERMEDIO o AVANZADO. Un valor desconocido responde 400."
url: "{{baseUrl}}/api/socios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Ana Ruiz",
      "documentoIdentidad": "SX-{{sufijo}}",
      "nivel": "EXPERTO",
      "objetivo": "FUERZA"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Rechaza el enum', () => pm.response.to.have.status(400));
      pm.test('El error trae un mensaje en espanol', () => pm.expect(pm.response.json().mensaje).to.be.a('string').and.not.empty);
      pm.test('Mensaje: formato esperado', () => pm.expect(pm.response.json().mensaje).to.include('formato esperado'));
    language: text/javascript
order: 10000
