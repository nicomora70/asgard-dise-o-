$kind: http-request
description: "`maximoSocios` debe estar entre 1 y 100. Con 0 responde 400."
url: "{{baseUrl}}/api/entrenadores"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Sin cupo",
      "documentoIdentidad": "E0-{{sufijo}}",
      "turno": "MANANA",
      "maximoSocios": 0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Valida el cupo', () => pm.response.to.have.status(400));
      pm.test('El error trae un mensaje en espanol', () => pm.expect(pm.response.json().mensaje).to.be.a('string').and.not.empty);
    language: text/javascript
order: 2000
