$kind: http-request
description: Lista todos los entrenadores con `sociosAsignados` y `tieneCupo`.
url: "{{baseUrl}}/api/entrenadores"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      pm.test('Incluye al entrenador creado', () => pm.expect(pm.response.json().map(e => e.id)).to.include(pm.collectionVariables.get('entrenadorId')));
    language: text/javascript
order: 5000
