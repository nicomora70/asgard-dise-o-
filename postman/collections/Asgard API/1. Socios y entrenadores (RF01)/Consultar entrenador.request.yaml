$kind: http-request
description: Detalle de un entrenador por id. Responde 404 si no existe.
url: "{{baseUrl}}/api/entrenadores/{{entrenadorId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      pm.test('Es el entrenador pedido', () => pm.expect(pm.response.json().id).to.eql(pm.collectionVariables.get('entrenadorId')));
    language: text/javascript
order: 6000
