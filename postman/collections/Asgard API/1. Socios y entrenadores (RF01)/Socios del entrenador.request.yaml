$kind: http-request
description: Socios asignados a un entrenador.
url: "{{baseUrl}}/api/entrenadores/{{entrenadorId}}/socios"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Lista los socios', () => pm.response.to.have.status(200));
      pm.test('Tiene 1 socio', () => pm.expect(pm.response.json().length === 1).to.be.true);
    language: text/javascript
order: 18000
