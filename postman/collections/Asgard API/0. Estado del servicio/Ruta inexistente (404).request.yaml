$kind: http-request
description: Una ruta que no existe devuelve el cuerpo de error comun con el mensaje `Ruta no encontrada`.
url: "{{baseUrl}}/api/no-existe"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 404', () => pm.response.to.have.status(404));
      pm.test('El error trae un mensaje en espanol', () => pm.expect(pm.response.json().mensaje).to.be.a('string').and.not.empty);
      pm.test('Mensaje: Ruta no encontrada', () => pm.expect(pm.response.json().mensaje).to.include('Ruta no encontrada'));
    language: text/javascript
order: 4000
