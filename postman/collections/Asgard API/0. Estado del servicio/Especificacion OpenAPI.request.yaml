$kind: http-request
description: Documento OpenAPI 3 generado por springdoc. Es la misma especificacion que muestra `/swagger-ui.html`.
url: "{{baseUrl}}/v3/api-docs"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      pm.test('Es OpenAPI con rutas', () => { const j = pm.response.json(); pm.expect(j.openapi).to.be.a('string'); pm.expect(Object.keys(j.paths)).to.include('/api/socios'); });
    language: text/javascript
order: 3000
