$kind: http-request
description: Detalle de un ejercicio. La sentadilla tiene sustitutos porque prensa y zancada la referenciaron (grafo bidireccional).
url: "{{baseUrl}}/api/ejercicios/{{sentadillaId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Responde 200', () => pm.response.to.have.status(200));
      pm.test('Tiene sustitutos (grafo no dirigido)', () => pm.expect(pm.response.json().sustitutos.length).to.be.above(0));
    language: text/javascript
order: 9000
