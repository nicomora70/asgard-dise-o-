$kind: http-request
description: Un sustituto con un id desconocido responde 404.
url: "{{baseUrl}}/api/ejercicios"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "nombre": "Hack {{sufijo}}",
      "grupoMuscular": "CUADRICEPS",
      "tipo": "COMPUESTO",
      "equipamiento": "MAQUINA",
      "sustitutos": [
        {
          "ejercicioId": "no-existe",
          "similitud": 0.5
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Valida los sustitutos', () => pm.response.to.have.status(404));
      pm.test('El error trae un mensaje en espanol', () => pm.expect(pm.response.json().mensaje).to.be.a('string').and.not.empty);
    language: text/javascript
order: 6000
