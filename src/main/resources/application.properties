spring.application.name=asgard

# Puerto (Render y otras plataformas inyectan PORT)
server.port=${PORT:8080}

# MongoDB: local por defecto; en despliegue se usa la variable MONGODB_URI (MongoDB Atlas)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/asgard}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/asgard}
spring.data.mongodb.auto-index-creation=true
# Nombre de la base de datos: se usa aunque la cadena de conexion no lo incluya (ej. .../?retryWrites=true)
spring.mongodb.database=${MONGODB_DATABASE:asgard}
spring.data.mongodb.database=${MONGODB_DATABASE:asgard}

# Respuestas JSON
spring.jackson.default-property-inclusion=non_null

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha

# Actuator (health para el despliegue)
management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------
# Parametros del motor de progresion (RF06 - RF11)
# ---------------------------------------------------------------
# Incremento de carga al SUBIR (kg), segun el tipo de ejercicio (RF08)
asgard.motor.incremento-superior=2.5
asgard.motor.incremento-inferior=5.0
asgard.motor.incremento-aislamiento=1.0
# Redondeo de la carga sugerida (kg): la carga se ajusta al disco mas cercano
asgard.motor.redondeo-kg=0.5
# Semaforo (RF09): sesiones sin mejora para AMARILLO y caida del 1RM para ROJO
asgard.motor.sesiones-estancamiento=3
asgard.motor.umbral-retroceso=0.05
# Decisiones de carga (RF08, RF10)
asgard.motor.porcentaje-deload=0.10
asgard.motor.porcentaje-bajada=0.05
asgard.motor.fallos-para-bajar=2
# Advertencia no bloqueante (RF06): carga sobre la sugerida y RPE de alerta
asgard.motor.umbral-sobrecarga=0.10
asgard.motor.rpe-alerta=9.5
# Prioridad (RF11): puntaje = diasSinEntrenar x factorSemaforo x factorTipo
asgard.motor.factor-rojo=2.0
asgard.motor.factor-amarillo=1.5
asgard.motor.factor-compuesto=1.2
asgard.motor.dias-sin-historial=30
# Capacidad de la pila para deshacer series (RF07)
asgard.motor.capacidad-deshacer=50

# ---------------------------------------------------------------
# Sesiones y planificador diario (RF04)
# ---------------------------------------------------------------
asgard.sesiones.zona-horaria=America/Bogota
asgard.sesiones.dias-revision=14
asgard.sesiones.planificador-habilitado=true
